<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Roadmap</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Fivecon -->
    <link
      rel="shortcut icon"
      href="../assets/images/logo/ancora_logo-sem-fundo.png"
      type="image/x-icon"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/pages/roadmap.css" />
    <script defer src="../assets/js/components/sidebar-component.js"></script>
    <script defer src="../assets/js/components/header-actions-component.js"></script>
    <script type="module" src="../assets/js/pages/roadmap.js"></script>

</head>

<body>

    <!-- Side Navigation Bar -->
    <sidebar-menu></sidebar-menu>

    <!-- Main Content Area -->
    <main class="main">
        <!-- Header -->
        <header class="header">
            <div class="header__text-wrapper">
                <h1 class="header__title">Roadmap — <span id="turma-nome">carregando...</span></h1>
                <p class="header__subtitle">Seu caminho de aprendizado personalizado</p>
                <div class="header__deco"></div>
            </div>
            <app-header-actions
                class="header__actions"
                search-placeholder="Buscar tópicos no roadmap..."
                avatar-alt="Student Profile Avatar">
            </app-header-actions>
        </header>

        <div class="content-area">
            <!-- Progress Summary Card -->
            <div class="progress-card">
                <div class="progress-card__deco"></div>
                <div class="progress-card__info">
                    <span class="progress-card__label">Seu progresso total</span>
                    <span class="progress-card__title" id="progresso-texto">0/0 concluídos</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-bar__fill" id="barra-progresso" style="width: 0%"></div>
                </div>
            </div>

            <!-- Roadmap Items List -->
            <div class="roadmap-list" id="roadmap-container">
                <p>Carregando roadmap...</p>
            </div>
        </div>
    </main>

    <!-- Decorative Kinetic Elements -->
    <div class="deco-dot deco-dot--lime"></div>
    <div class="deco-dots">
        <div class="deco-dots__item deco-dots__item--navy"></div>
        <div class="deco-dots__item deco-dots__item--blue"></div>
        <div class="deco-dots__item deco-dots__item--lime"></div>
    </div>
    <div class="glow-bg"></div>


  <!-- VLibras -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>new window.VLibras.Widget("https://vlibras.gov.br/app");</script>
</body>

</html>
