<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Âncora — Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages/home.css">
  <link rel="stylesheet" href="../assets/css/pages/mobile-drawer.css">
</head>
<body>

  <sidebar-menu></sidebar-menu>

  <!-- topbar mobile -->
  <div class="mobile-topbar">
    <button class="topbar-menu" aria-label="Abrir menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
           stroke="white" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="topbar-search">
      <span class="material-symbols-outlined">search</span>
      <input type="text" id="searchInput" placeholder="Buscar monitoria...">
    </div>
    <div class="topbar-bell">
      <span class="material-symbols-outlined">notifications</span>
      <div class="bell-dot"></div>
    </div>
    <div class="topbar-avatar" id="avatarMobile">IS</div>
  </div>

  <main class="main-content">
    <header class="page-header">
      <div>
        <h1>Monitorias Disponíveis</h1>
        <p>Encontre o monitor ideal para turbinar seus estudos</p>
      </div>
      <app-header-actions search-placeholder="Buscar monitoria..."></app-header-actions>
    </header>

    <div class="filtros-wrap">
      <div class="filtros-grupo">
        <span class="filtros-label">Matérias:</span>
        <div class="filtros" id="filtrosMateria">
          <button class="filtro-btn ativo" data-filtro="todas">Todas</button>
          <button class="filtro-btn" data-filtro="HTML & CSS">HTML & CSS</button>
          <button class="filtro-btn" data-filtro="JavaScript">JavaScript</button>
          <button class="filtro-btn" data-filtro="Python">Python</button>
          <button class="filtro-btn" data-filtro="Lógica">Lógica</button>
          <button class="filtro-btn" data-filtro="Java">Java</button>
        </div>
      </div>
      <div class="filtros-grupo">
        <span class="filtros-label">Turno:</span>
        <div class="filtros" id="filtrosTurno">
          <button class="filtro-btn ativo" data-turno="todos">Todos</button>
          <button class="filtro-btn" data-turno="manha">Manhã</button>
          <button class="filtro-btn" data-turno="tarde">Tarde</button>
          <button class="filtro-btn" data-turno="noite">Noite</button>
          <button class="filtro-btn destaque" data-turno="destaque">★ Destaques</button>
        </div>
      </div>
    </div>

    <span class="section-label" id="sectionLabel">Em destaque esta semana</span>

    <div id="lista-monitorias" class="lista-monitorias">
      <div class="loading-state">
        <span class="material-symbols-outlined">sync</span>
        Carregando monitorias...
      </div>
    </div>

    <div class="load-more" id="loadMore" style="display:none">
      <p class="load-more-label" id="loadMoreLabel">Exibindo 4 de 8 monitorias</p>
      <button class="btn-load" id="btnLoadMore">
        <span class="material-symbols-outlined">expand_more</span>
      </button>
      <span class="load-more-text">Carregar mais</span>
    </div>
  </main>

  <script defer src="../assets/js/components/sidebar-component.js"></script>
  <script defer src="../assets/js/components/header-actions-component.js"></script>
  <script defer src="../assets/js/pages/mobile-drawer.js"></script>
  <script type="module" src="../assets/js/pages/home.js"></script>

  <!-- VLibras -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>new window.VLibras.Widget("https://vlibras.gov.br/app");</script>
</body>
</html>
