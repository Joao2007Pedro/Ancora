<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Âncora — Home</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/global.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/pages/home.css" />
    <!-- Fivecon -->
    <link
      rel="shortcut icon"
      href="../assets/images/logo/ancora_logo-sem-fundo.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <sidebar-menu></sidebar-menu>

    <main class="main-content">
      <header class="page-header">
        <div>
          <div class="page-header__brand">
            <span class="page-header__brand-mark" aria-hidden="true" style="background-color: #3333FF;">
              <img
                src="../assets/images/logo/ancora_logo-sem-fundo.png"
                alt=""
                class="page-header__brand-image"
              />
            </span>
            <div class="page-header__brand-text">
              <span class="page-header__brand-kicker">Âncora</span>
              <span class="page-header__brand-name"
                >Plataforma de Monitorias</span
              >
            </div>
          </div>
          <h1>Monitorias Disponíveis</h1>
          <p>Encontre o monitor ideal para turbinar seus estudos</p>
        </div>
        <app-header-actions></app-header-actions>
      </header>

      <div class="filtros">
        <button class="filtro-btn ativo" data-filtro="todas">Todas</button>
        <button class="filtro-btn" data-filtro="JavaScript">JavaScript</button>
        <button class="filtro-btn" data-filtro="Python">Python</button>
        <button class="filtro-btn" data-filtro="HTML & CSS">HTML & CSS</button>
        <button class="filtro-btn" data-filtro="Java">Java</button>
      </div>

      <div id="lista-monitorias" class="lista-monitorias">
        <p class="loading">Carregando monitorias...</p>
      </div>
    </main>

    <script defer src="../assets/js/components/sidebar-component.js"></script>
    <script
      defer
      src="../assets/js/components/header-actions-component.js"
    ></script>
    <script type="module" src="../assets/js/pages/home.js"></script>
        <!-- VLibras -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget("https://vlibras.gov.br/app");
    </script>
  </body>
</html>
