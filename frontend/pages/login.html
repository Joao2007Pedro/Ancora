<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link rel="stylesheet" href="../assets/css/login.css" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <!--  -->
  </head>
  <body>
    <main>
      <section class="sec1">
        <div class="titulo">
          <div class="itens_titulo">
            <img src="../assets/images/login/Status Dot.png" alt="" />
            <h1>Âncora</h1>
          </div>
        </div>

        <div class="plataform">
          <img src="../assets/images/login/Status Dot.png" alt="" />
          <h2>Plataforma acadêmica</h2>
        </div>

        <div class="text_sec1">
          <h1>
            Conecte alunos <br />
            e <span>monitores</span> em um só lugar.
          </h1>
        </div>

        <div class="text2_sec2">
          <h2>
            Tire dúvidas, acompanhe o progresso e evolua junto com sua turma.
          </h2>
        </div>

        <div class="items_container">
          <div class="item" id="item1">
            <div class="star">
              <img src="../assets/images/login/Star.png" alt="" />
            </div>
            <h2>Avaliações em tempo real</h2>
          </div>

          <div class="item">
            <div class="star">
              <img src="../assets/images/login/Timer.png" alt="" />
            </div>
            <h2>Agendamento de monitoria</h2>
          </div>

          <div class="item">
            <div class="star">
              <img src="../assets/images/login/Users.png" alt="" />
            </div>
            <h2>Feed colaborativo da turma</h2>
          </div>
        </div>
        <img id="eclipse" src="../assets/images/login/Ellipse 1.png" alt="" />
        <img id="eclipse2" src="../assets/images/login/Ellipse 2.png" alt="" />
      </section>
      <section class="sec2"></section>
    </main>
  </body>
</html>
