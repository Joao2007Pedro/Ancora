<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Âncora — Monitorias Agendadas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Fivecon -->
    <link
      rel="shortcut icon"
      href="../assets/images/logo/ancora_logo-sem-fundo.png"
      type="image/x-icon"
    />
  <link rel="stylesheet" href="../assets/css/pages/minhas-monitorias.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages/mobile-drawer.css">
  <script defer src="../assets/js/components/sidebar-component.js"></script>
  <script defer src="../assets/js/components/header-actions-component.js"></script>
  <script defer src="../assets/js/pages/mobile-drawer.js"></script>
</head>
<body>
  <!-- Elementos Decorativos -->
  <div class="decorative-blob"></div>
  <div class="decorative-dot"></div>

  <!-- Barra Lateral -->
  <sidebar-menu></sidebar-menu>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    <header class="top-header">
      <div class="header-titles">
        <h1>Monitorias Agendadas</h1>
        <p>Veja as monitorias em que você vai participar.</p>
      </div>
      <app-header-actions
        search-placeholder="Buscar monitoria..."
        avatar-alt="Perfil">
      </app-header-actions>
    </header>

    <section class="tabs" id="sessionTabs">
      <button class="tab aba-btn active ativo" data-aba="proximas">Próximas</button>
      <button class="tab aba-btn" data-aba="passadas">Passadas</button>
      <button class="tab aba-btn" data-aba="canceladas">Canceladas</button>
    </section>

    <div class="cards-grid" id="lista-minhas-monitorias">
      <div class="monitorias-loading" aria-live="polite">
        <p>Carregando suas monitorias...</p>
      </div>
    </div>
  </main>

  <script type="module" src="../assets/js/pages/minhas-monitorias.js"></script>


  <!-- VLibras -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>new window.VLibras.Widget("https://vlibras.gov.br/app");</script>
</body>
</html>
