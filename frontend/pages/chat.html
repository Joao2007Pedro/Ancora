<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="../assets/css/pages/chat.css"type="text/css"/>
</head>

<body>

    <sidebar-menu></sidebar-menu>

    <div class="chat-app">

    <aside class="contatos">
        <header>
            <h1>Chat</h1>
        </header>

        <div class="busca">
            <label for="buscar-contato">
                <input type="search" id="buscar-contato" placeholder="Busca....">
            </label>
            <span class="icone-busca" aria-hidden="true">🔍</span>
        </div>

        <nav class="lista-contatos" aria-label="Contatos">
            <ul>
                <li><a href="#"><img src="https://api.dicebear.com/7.x/adventurer/svg?seed=prof" alt="">(professor)</a></li>
                <li><a href="#">(aluno)</a></li>
                <li><a href="#">(monitor)</a></li>
                <li><a href="#">(aluno)</a></li>
                <li><a href="#">(monitora)</a></li>
            </ul>
        </nav>
    </aside>

    <main class="conversa" aria-label="Conversa">

        <header class="cabecalho-chat">
            <div>
                <h2>Aluno</h2>
                <span class="status">● online</span>
            </div>
        </header>

        <section id="lista-mensagens" aria-label="Mensagens" aria-live="polite">
        </section>

        <footer class="campo-mensagem">
            <button type="button" aria-label="Emoji">😊</button>

            <label for="input-mensagem">
                <input type="text" id="input-mensagem" placeholder="Mensagem"
                    onkeydown="if(event.key==='Enter') enviarMensagem()">
            </label>

            <button type="button" aria-label="Anexar">📎</button>
            <button type="button" class="btn-enviar" aria-label="Enviar" onclick="enviarMensagem()">➤</button>
        </footer>

    </main>
</div>
</body>

</html>
